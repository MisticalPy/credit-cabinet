server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # SPA: неизвестные пути отдаёт index.html (роутинг на клиенте)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API, админка и статика Django идут на бэкенд
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://web:8000;
        # Host с портом, иначе Django вернёт 403 "Origin checking failed"
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # У ассистента LLM-таймаут 30 с, берём запас
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
